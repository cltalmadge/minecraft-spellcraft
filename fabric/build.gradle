plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-fabric"
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    sharedJava {
        canBeResolved = true
        canBeConsumed = false
    }
    sharedResources {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // IDE / Java project-model dependencies.
    compileOnly project(':domain')
    compileOnly project(':common')

    // Source inclusion for the actual Fabric jar.
    sharedJava project(path: ':domain', configuration: 'domainJava')
    sharedJava project(path: ':common', configuration: 'commonJava')

    sharedResources project(path: ':domain', configuration: 'domainResources')
    sharedResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.sharedJava
    source(configurations.sharedJava)
}

def resourceVersion = version.toString()

processResources {
    dependsOn configurations.sharedResources
    from(configurations.sharedResources)

    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') {
        expand 'version': resourceVersion
    }
}

java {
    withSourcesJar()
}
