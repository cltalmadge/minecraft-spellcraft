plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-domain"
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Export source directories so the loader projects can compile the pure domain
// classes directly into their distributable jars without duplicating source.
configurations {
    domainJava {
        canBeResolved = false
        canBeConsumed = true
    }
    domainResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    domainJava sourceSets.main.java.sourceDirectories.singleFile
    domainResources sourceSets.main.resources.sourceDirectories.singleFile
}
