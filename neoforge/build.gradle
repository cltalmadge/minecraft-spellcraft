plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge"
}

configurations {
    sharedJava {
        canBeResolved = true
        canBeConsumed = false
    }
    sharedResources {
        canBeResolved = true
        canBeConsumed = false
    }
}

def neoVersionValue = neo_version.toString()
def modIdValue = mod_id.toString()
def resourceProperties = [
    minecraft_version: minecraft_version.toString(),
    minecraft_version_range: minecraft_version_range.toString(),
    neo_version: neo_version.toString(),
    mod_id: mod_id.toString(),
    mod_name: mod_name.toString(),
    mod_license: mod_license.toString(),
    mod_version: mod_version.toString()
]

neoForge {
    version = neoVersionValue

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', modIdValue
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    sharedJava project(path: ':domain', configuration: 'domainJava')
    sharedJava project(path: ':common', configuration: 'commonJava')
    sharedResources project(path: ':domain', configuration: 'domainResources')
    sharedResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.sharedJava
    source(configurations.sharedJava)
}

processResources {
    dependsOn configurations.sharedResources
    from(configurations.sharedResources)

    inputs.properties resourceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand resourceProperties
    }
}
